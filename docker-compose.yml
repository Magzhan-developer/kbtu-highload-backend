# Set explicitly because the folder name contains "#".
name: blog-platform

services:
  postgres:
    image: postgres:17-alpine
    # The default 128 MB cache is far smaller than the benchmark dataset.
    command: ["postgres", "-c", "shared_buffers=512MB"]
    environment:
      POSTGRES_DB: blog
      POSTGRES_USER: blog
      POSTGRES_PASSWORD: blog
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./scripts:/scripts:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U blog -d blog"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  postgres-data:
