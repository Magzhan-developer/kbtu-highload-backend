global:
  scrape_interval: 5s
  evaluation_interval: 15s

scrape_configs:
  # The application runs on the host, not in Docker.
  - job_name: blog-app
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["host.docker.internal:8080"]

  - job_name: postgres
    static_configs:
      - targets: ["postgres-exporter:9187"]

  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]

  - job_name: benchmark-results
    scrape_interval: 15s
    static_configs:
      - targets: ["benchmark-exporter:9188"]
