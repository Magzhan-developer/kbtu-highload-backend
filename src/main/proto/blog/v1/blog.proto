syntax = "proto3";

package blog.v1;

import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";

option java_multiple_files = true;
option java_outer_classname = "BlogProto";
option java_package = "kz.kbtu.blog.grpc.v1";

// All calls are unary: one request, one response.
//
// Writes identify the caller through the "x-user-id" metadata entry. That is a
// development stand-in for real authentication. Reads need no identity.
service BlogService {
  rpc CreatePost(CreatePostRequest) returns (PostResponse);
  rpc GetPost(GetPostRequest) returns (PostResponse);
  rpc GetAuthorPosts(GetAuthorPostsRequest) returns (PostListResponse);
  rpc UpdatePost(UpdatePostRequest) returns (PostResponse);
  rpc DeletePost(DeletePostRequest) returns (google.protobuf.Empty);

  rpc CreateComment(CreateCommentRequest) returns (CommentResponse);
  rpc GetComments(GetCommentsRequest) returns (CommentListResponse);
  rpc UpdateComment(UpdateCommentRequest) returns (CommentResponse);
  rpc DeleteComment(DeleteCommentRequest) returns (google.protobuf.Empty);
}

message CreatePostRequest {
  // A UUID the client generates once per logical operation and reuses on every retry.
  string idempotency_key = 1;
  string title = 2;
  string content = 3;
}

message GetPostRequest {
  int64 post_id = 1;
}

message GetAuthorPostsRequest {
  int64 author_id = 1;
  // 0 means the server default.
  int32 limit = 2;
  // Copied from next_cursor of the previous page. Empty for the first page.
  string cursor = 3;
}

message UpdatePostRequest {
  int64 post_id = 1;
  string title = 2;
  string content = 3;
}

message DeletePostRequest {
  int64 post_id = 1;
}

message PostResponse {
  int64 post_id = 1;
  int64 author_id = 2;
  string title = 3;
  string content = 4;
  google.protobuf.Timestamp created_at = 5;
  google.protobuf.Timestamp updated_at = 6;
}

message PostListResponse {
  repeated PostResponse items = 1;
  // Empty on the last page.
  string next_cursor = 2;
}

message CreateCommentRequest {
  // A UUID the client generates once per logical operation and reuses on every retry.
  string idempotency_key = 1;
  int64 post_id = 2;
  string content = 3;
}

message GetCommentsRequest {
  int64 post_id = 1;
  // 0 means the server default.
  int32 limit = 2;
  // Copied from next_cursor of the previous page. Empty for the first page.
  string cursor = 3;
}

message UpdateCommentRequest {
  int64 comment_id = 1;
  string content = 2;
}

message DeleteCommentRequest {
  int64 comment_id = 1;
}

message CommentResponse {
  int64 comment_id = 1;
  int64 post_id = 2;
  int64 user_id = 3;
  string content = 4;
  google.protobuf.Timestamp created_at = 5;
  google.protobuf.Timestamp updated_at = 6;
}

message CommentListResponse {
  repeated CommentResponse items = 1;
  // Empty on the last page.
  string next_cursor = 2;
}
